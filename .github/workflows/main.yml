name: Build Minecraft JAR

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Konfiguracja Javy (zmień na Java 17 lub 21 w zależności od wersji silnika, np. Paper 1.20+ wymaga Javy 17+)
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Wariant 1: Jeśli używasz Gradle (np. Gradle Wrapper ./gradlew)
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew build

    # Wariant 2 (alternatywa): Jeśli używasz Mavena, odkomentuj poniższe linie, a zablokuj Gradle wyżej:
    # - name: Build with Maven
    #   run: mvn clean package

    # Automatyczne szukanie i zapisywanie wygenerowanego pliku .jar jako artefakt GitHub
    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: plugin-jar
        path: |
          build/libs/*.jar
          target/*.jar
